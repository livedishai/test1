<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Birthday Sprinkles Magic Mug 3D | Kovai Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg: #0d0816;
      --card-bg: rgba(26, 17, 40, 0.85);
      --gold: #D4AF37;
      --gold-bright: #FFE58F;
      --glass-border: rgba(212, 175, 55, 0.3);
      --text: #FAF7F2;
      --text-dim: rgba(250, 247, 242, 0.65);
      --accent: linear-gradient(135deg, #7b1fa2 0%, #38006b 100%);
      --heat-gradient: linear-gradient(135deg, #ff5722 0%, #e91e63 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    header {
      padding: max(16px, env(safe-area-inset-top)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(13, 8, 22, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .back-link {
      color: var(--gold-bright);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--gold-bright);
    }

    .stage-section {
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #25143e 0%, var(--bg) 80%);
    }

    .stage-container {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      border-radius: 20px;
      background: rgba(18, 11, 30, 0.7);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.05);
      overflow: hidden;
    }

    #threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .drag-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
    }

    .controls-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }

    .action-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }

    .action-btn:active { transform: scale(0.97); }

    .btn-upload { background: var(--accent); }
    .btn-heat { background: var(--heat-gradient); color: #fff; }

    #fileInput { display: none; }

    .customizer-box {
      max-width: 600px;
      margin: 12px auto 0;
      width: calc(100% - 40px);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .customizer-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 6px;
    }

    .customizer-box input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 6, 18, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .customizer-box input[type="text"]:focus {
      border-color: var(--gold-bright);
    }

    .section-heading {
      padding: 16px 20px 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-bright);
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .product-list {
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s, background 0.2s;
    }

    .product-card.selected {
      border-color: var(--gold-bright);
      background: rgba(58, 30, 96, 0.7);
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
    }

    .product-badge {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .product-info { flex: 1; }

    .product-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .footer-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px max(16px, env(safe-area-inset-bottom));
      background: rgba(13, 8, 22, 0.95);
      border-top: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .whatsapp-btn {
      width: 100%;
      max-width: 440px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      border-radius: 14px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
      transition: transform 0.15s ease;
    }

    .whatsapp-btn:active { transform: scale(0.97); }

    .whatsapp-btn svg {
      width: 20px;
      height: 20px;
      fill: #FFFFFF;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="back-link">‹ Back to AR Video</a>
    <div class="brand-title">3D MAGIC STUDIO</div>
  </header>

  <section class="stage-section">
    <div class="stage-container">
      <div id="threeCanvas"></div>
      <div class="drag-hint">👆 Drag to rotate 3D view</div>
    </div>

    <div class="controls-row">
      <button class="action-btn btn-upload" id="triggerUpload">📸 Upload Photo</button>
      <input type="file" id="fileInput" accept="image/*" />
      <button class="action-btn btn-heat" id="heatToggleBtn">☕ Pour Hot Drink</button>
    </div>
  </section>

  <div class="customizer-box" id="nameBox">
    <label for="customNameInput">Personalized Birthday Name / Message</label>
    <input type="text" id="customNameInput" placeholder="e.g. Happy Birthday Nishanth!" value="Happy Birthday Nishanth!" maxlength="32" />
  </div>

  <div class="section-heading">Select Gift to Preview in 3D</div>
  <div class="product-list" id="productList"></div>

  <div class="footer-dock">
    <a id="orderBtn" href="#" target="_blank" class="whatsapp-btn">
      <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.53c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.84-.86 2.06s.88 2.39 1 2.56c.12.17 1.74 2.65 4.21 3.72.59.25 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.17-.48-.29"/></svg>
      Order This Gift On WhatsApp
    </a>
  </div>

  <script>
    const products = [
      {
        id: "magic_mug",
        title: "Birthday Sprinkles Magic Mug",
        icon: "☕",
        desc: "Thermo-chromic matte black mug that reveals confetti and photo when hot.",
        whatsappText: "Hi Kovai Studio! I want to order the Birthday Sprinkles Magic Mug with my custom photo."
      },
      {
        id: "pillow",
        title: "Personalized Cushion / Pillow",
        icon: "🛋️",
        desc: "Edge-to-edge full bleed sublimation pillow with plump contouring.",
        whatsappText: "Hi Kovai Studio! I customized a Photo Pillow in 3D and want to order."
      },
      {
        id: "tshirt",
        title: "Customized Photo T-Shirt",
        icon: "👕",
        desc: "Shaped apparel mesh with sleeves, collar ring, and chest artwork.",
        whatsappText: "Hi Kovai Studio! I customized a T-Shirt with my photo in 3D and want to order."
      },
      {
        id: "frame",
        title: "Engraved Wooden Photo Frame",
        icon: "🖼️",
        desc: "Classic deep-grain wooden frame with center photo display.",
        whatsappText: "Hi Kovai Studio! I customized a Wooden Frame in 3D and want to order."
      },
      {
        id: "magnet",
        title: "AR Video Fridge Magnet",
        icon: "🧲",
        desc: "Glossy magnetic tile that triggers video playback in AR.",
        whatsappText: "Hi Kovai Studio! I want to order customized AR Video Fridge Magnets."
      }
    ];

    let currentProduct = products[0];
    let userImgElement = null;
    let customTextValue = "Happy Birthday Nishanth!";
    let isHotState = true;
    let currentHeatUniform = { value: 1.0 };

    const container = document.getElementById("threeCanvas");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.15, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 1.8;
    controls.maxDistance = 4.5;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff5e6, 1.2);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xd4af37, 0.4);
    dirLight2.position.set(-2, -1, -2);
    scene.add(dirLight2);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const defaultImg = new Image();
    defaultImg.crossOrigin = "anonymous";
    defaultImg.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80";
    defaultImg.onload = () => {
      userImgElement = defaultImg;
      buildModel(currentProduct.id);
    };

    function drawImageCover(ctx, img, targetX, targetY, targetW, targetH) {
      const imgRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let sWidth = img.width;
      let sHeight = img.height;
      let sx = 0;
      let sy = 0;

      if (imgRatio > targetRatio) {
        sWidth = img.height * targetRatio;
        sx = (img.width - sWidth) / 2;
      } else {
        sHeight = img.width / targetRatio;
        sy = (img.height - sHeight) / 2;
      }

      ctx.drawImage(img, sx, sy, sWidth, sHeight, targetX, targetY, targetW, targetH);
    }

    function generateSprinklesCanvasTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sprinkleColors = ["#FF5722", "#E91E63", "#9C27B0", "#2196F3", "#4CAF50", "#FFC107", "#00BCD4"];
      for (let i = 0; i < 110; i++) {
        ctx.fillStyle = sprinkleColors[i % sprinkleColors.length];
        ctx.save();
        ctx.translate(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.rotate(Math.random() * Math.PI);
        if (i % 3 === 0) {
          ctx.beginPath();
          ctx.roundRect(-10, -4, 20, 8, 4);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, 4 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      const frameX = 362, frameY = 55, frameW = 300, frameH = 300;
      if (userImgElement) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.18)";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(frameX - 6, frameY - 6, frameW + 12, frameH + 12);
        
        drawImageCover(ctx, userImgElement, frameX, frameY, frameW, frameH);
        
        ctx.strokeStyle = "#D4AF37";
        ctx.lineWidth = 6;
        ctx.strokeRect(frameX, frameY, frameW, frameH);
        ctx.restore();
      }

      ctx.save();
      ctx.font = "bold 34px 'Plus Jakarta Sans', sans-serif";
      ctx.fillStyle = "#261338";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(255,255,255,0.8)";
      ctx.shadowBlur = 4;
      ctx.fillText(customTextValue, canvas.width / 2, 420);

      ctx.font = "600 18px 'Plus Jakarta Sans', sans-serif";
      ctx.fillStyle = "#8E24AA";
      ctx.letterSpacing = "3px";
      ctx.fillText("✨ SPECIAL CELEBRATION EDITION ✨", canvas.width / 2, 460);
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    function createMagicMugMesh() {
      const group = new THREE.Group();
      const compositeTex = generateSprinklesCanvasTexture();

      const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.1, 48);
      const ceramicMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.05 });
      const bodyMesh = new THREE.Mesh(bodyGeo, ceramicMat);
      group.add(bodyMesh);

      const innerGeo = new THREE.CylinderGeometry(0.44, 0.44, 1.08, 48, 1, true);
      const innerMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, side: THREE.BackSide });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      innerMesh.position.y = 0.05;
      group.add(innerMesh);

      const thermoShaderMat = new THREE.ShaderMaterial({
        uniforms: {
          uTexture: { value: compositeTex },
          uHeatProgress: currentHeatUniform
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uTexture;
          uniform float uHeatProgress;
          varying vec2 vUv;

          void main() {
            vec4 revealedColor = texture2D(uTexture, vUv);
            vec4 blackCoat = vec4(0.08, 0.08, 0.09, 1.0);
            float revealFactor = smoothstep(vUv.y - 0.15, vUv.y + 0.15, uHeatProgress);
            gl_FragColor = mix(blackCoat, revealedColor, revealFactor);
          }
        `,
        side: THREE.DoubleSide
      });

      const decalGeo = new THREE.CylinderGeometry(0.505, 0.505, 0.92, 48, 1, true, Math.PI * 0.25, Math.PI * 1.5);
      const decalMesh = new THREE.Mesh(decalGeo, thermoShaderMat);
      group.add(decalMesh);

      const handleGeo = new THREE.TorusGeometry(0.28, 0.055, 24, 48, Math.PI);
      const handleMesh = new THREE.Mesh(handleGeo, ceramicMat);
      handleMesh.position.set(0.5, 0, 0);
      handleMesh.rotation.set(0, 0, -Math.PI / 2);
      group.add(handleMesh);

      return group;
    }

    function createPillowMesh(texture) {
      const group = new THREE.Group();
      const width = 1.3, height = 1.3, depth = 0.42;
      const geo = new THREE.BoxGeometry(width, height, depth, 32, 32, 10);
      const pos = geo.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        const nx = x / (width / 2);
        const ny = y / (height / 2);
        const puff = Math.cos((nx * Math.PI) / 2) * Math.cos((ny * Math.PI) / 2);

        if (z > 0) {
          pos.setZ(i, z + puff * 0.22);
        } else if (z < 0) {
          pos.setZ(i, z - puff * 0.22);
        }

        const cornerDist = Math.sqrt(nx * nx + ny * ny);
        if (cornerDist > 1.1) {
          pos.setX(i, x * 0.96);
          pos.setY(i, y * 0.96);
        }
      }
      geo.computeVertexNormals();

      const whiteFabricMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.85 });
      const printMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.65, metalness: 0.05 });

      const mats = [whiteFabricMat, whiteFabricMat, whiteFabricMat, whiteFabricMat, printMat, whiteFabricMat];
      const pillowMesh = new THREE.Mesh(geo, mats);
      group.add(pillowMesh);

      const seamGeo = new THREE.TorusGeometry(0.82, 0.016, 12, 4);
      seamGeo.rotateZ(Math.PI / 4);
      const seamMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
      const seamMesh = new THREE.Mesh(seamGeo, seamMat);
      group.add(seamMesh);

      return group;
    }

    function createTShirtMesh(texture) {
      const group = new THREE.Group();
      const shape = new THREE.Shape();
      shape.moveTo(-0.42, -0.75);
      shape.lineTo(0.42, -0.75);
      shape.lineTo(0.44, 0.25);
      shape.lineTo(0.85, 0.05);
      shape.lineTo(0.92, 0.28);
      shape.lineTo(0.48, 0.62);
      shape.lineTo(0.20, 0.62);
      shape.quadraticCurveTo(0, 0.48, -0.20, 0.62);
      shape.lineTo(-0.48, 0.62);
      shape.lineTo(-0.92, 0.28);
      shape.lineTo(-0.85, 0.05);
      shape.lineTo(-0.44, 0.25);
      shape.closePath();

      const shirtGeo = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: 0.12, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4 });
      shirtGeo.center();
      const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1a1228, roughness: 0.9, metalness: 0.05 });
      const shirtMesh = new THREE.Mesh(shirtGeo, shirtMat);
      group.add(shirtMesh);

      const collarGeo = new THREE.TorusGeometry(0.18, 0.025, 12, 32, Math.PI);
      const collarMat = new THREE.MeshStandardMaterial({ color: 0x2d1f45, roughness: 0.9 });
      const collarMesh = new THREE.Mesh(collarGeo, collarMat);
      collarMesh.position.set(0, 0.48, 0.07);
      collarMesh.rotation.set(Math.PI, 0, 0);
      group.add(collarMesh);

      const printGeo = new THREE.PlaneGeometry(0.5, 0.58);
      const printMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const printMesh = new THREE.Mesh(printGeo, printMat);
      printMesh.position.set(0, -0.05, 0.095);
      group.add(printMesh);

      return group;
    }

    function buildModel(type) {
      while (modelGroup.children.length > 0) {
        const obj = modelGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        modelGroup.remove(obj);
      }

      let activeTex;
      if (userImgElement) {
        activeTex = new THREE.Texture(userImgElement);
        activeTex.needsUpdate = true;
        activeTex.encoding = THREE.sRGBEncoding;
      }

      if (type === "magic_mug") {
        const mug = createMagicMugMesh();
        modelGroup.add(mug);
        modelGroup.scale.set(1, 1, 1);
        document.getElementById("nameBox").style.display = "block";
        document.getElementById("heatToggleBtn").style.display = "flex";

      } else {
        document.getElementById("nameBox").style.display = "none";
        document.getElementById("heatToggleBtn").style.display = "none";

        if (type === "pillow") {
          const pillow = createPillowMesh(activeTex);
          modelGroup.add(pillow);
          modelGroup.scale.set(1, 1, 1);

        } else if (type === "tshirt") {
          const tshirt = createTShirtMesh(activeTex);
          modelGroup.add(tshirt);
          modelGroup.scale.set(1.15, 1.15, 1.15);

        } else if (type === "frame") {
          const frameGeo = new THREE.BoxGeometry(1.2, 1.4, 0.06);
          const woodMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.6 });
          const frameMesh = new THREE.Mesh(frameGeo, woodMat);
          modelGroup.add(frameMesh);

          const photoGeo = new THREE.PlaneGeometry(1.0, 1.2);
          const photoMat = new THREE.MeshBasicMaterial({ map: activeTex, side: THREE.DoubleSide });
          const photoMesh = new THREE.Mesh(photoGeo, photoMat);
          photoMesh.position.z = 0.035;
          modelGroup.add(photoMesh);
          modelGroup.scale.set(1, 1, 1);

        } else if (type === "magnet") {
          const magnetGeo = new THREE.BoxGeometry(1.0, 1.0, 0.03);
          const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
          const printMat = new THREE.MeshBasicMaterial({ map: activeTex });
          const mats = [blackMat, blackMat, blackMat, blackMat, printMat, blackMat];
          const magnetMesh = new THREE.Mesh(magnetGeo, mats);
          modelGroup.add(magnetMesh);
          modelGroup.scale.set(1, 1, 1);
        }
      }
    }

    const productListEl = document.getElementById("productList");
    const fileInput = document.getElementById("fileInput");
    const triggerUpload = document.getElementById("triggerUpload");
    const heatToggleBtn = document.getElementById("heatToggleBtn");
    const customNameInput = document.getElementById("customNameInput");
    const orderBtn = document.getElementById("orderBtn");

    function renderList() {
      productListEl.innerHTML = "";
      products.forEach(item => {
        const card = document.createElement("div");
        card.className = `product-card ${item.id === currentProduct.id ? 'selected' : ''}`;
        card.innerHTML = `
          <div class="product-badge">${item.icon}</div>
          <div class="product-info">
            <div class="product-title">${item.title}</div>
            <div class="product-desc">${item.desc}</div>
          </div>
        `;
        card.addEventListener("click", () => {
          currentProduct = item;
          document.querySelectorAll(".product-card").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");
          buildModel(item.id);
          updateWhatsAppLink();
        });
        productListEl.appendChild(card);
      });
    }

    function updateWhatsAppLink() {
      const msg = `${currentProduct.whatsappText} Personalization Message: "${customTextValue}".`;
      orderBtn.href = `https://wa.me/?text=${encodeURIComponent(msg)}`;
    }

    triggerUpload.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userImgElement = img;
            buildModel(currentProduct.id);
            triggerUpload.textContent = "✨ Photo Applied!";
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    customNameInput.addEventListener("input", (e) => {
      customTextValue = e.target.value || "Happy Birthday!";
      if (currentProduct.id === "magic_mug") {
        buildModel("magic_mug");
      }
      updateWhatsAppLink();
    });

    heatToggleBtn.addEventListener("click", () => {
      isHotState = !isHotState;
      const targetVal = isHotState ? 1.0 : 0.0;
      heatToggleBtn.textContent = isHotState ? "❄️ Cool Down (Black)" : "☕ Pour Hot Drink";

      let start = null;
      const initialVal = currentHeatUniform.value;

      function animateHeat(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / 1400, 1.0);
        currentHeatUniform.value = THREE.MathUtils.lerp(initialVal, targetVal, progress);

        if (progress < 1.0) {
          requestAnimationFrame(animateHeat);
        }
      }
      requestAnimationFrame(animateHeat);
    });

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    renderList();
    updateWhatsAppLink();
    animate();
  </script>
</body>
</html>
